<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 소개 페이지</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            color: #333;
        }
        header {
            background: #4A90E2;
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        section {
            margin-bottom: 2rem;
        }
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 1rem 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>환영합니다!</h1>
        <p>이곳은 나만의 소개 홈페이지입니다.</p>
    </header>
    <main>
        <section id="about">
            <h2>About Me</h2>
            <p>간단한 자기소개를 이곳에 작성하세요. 취미나 관심사 등을 자유롭게 소개할 수 있습니다.</p>
        </section>
        <section id="projects">
            <h2>Projects</h2>
            <p>진행했던 프로젝트나 공부한 내용들을 정리해 보세요.</p>
        </section>
        <section id="contact">
            <h2>Contact</h2>
            <p>연락 가능한 이메일이나 소셜 미디어 링크를 추가하세요.</p>
        </section>
    </main>
    <footer>
        &copy; 2025 임백향
    </footer>
</body>
</html>
